name: Production operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run on the VPS
        required: true
        type: choice
        default: audit
        options:
          - audit
          - verify
          - deploy
          - rollback
          - cleanup
      release_ref:
        description: Immutable root release tag used by verify and deploy
        required: false
        type: string
      cleanup_run_id:
        description: Cancelled verify run ID to remove during cleanup
        required: false
        type: string

concurrency:
  group: monino-tools-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    env:
      SMOKE_ADMIN_NAME: ${{ secrets.SMOKE_ADMIN_NAME }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
    permissions:
      contents: read
    steps:
      - name: Validate release reference
        if: inputs.operation == 'verify' || inputs.operation == 'deploy'
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          test -n "$RELEASE_REF"
          case "$RELEASE_REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release_ref must be an immutable SemVer tag such as v1.0.0" >&2; exit 1 ;;
          esac

      - name: Check out the pinned release
        if: inputs.operation == 'verify' || inputs.operation == 'deploy'
        uses: actions/checkout@v6
        with:
          repository: YaroslavTaranich/monino-tools-nginx
          ref: ${{ inputs.release_ref }}
          submodules: recursive
          path: release

      - name: Upload the release to the VPS
        if: inputs.operation == 'verify' || inputs.operation == 'deploy'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: release
          target: /root/monino-tools-releases/${{ github.run_id }}

      - name: Run production operation
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 30m
          envs: SMOKE_ADMIN_NAME,SMOKE_ADMIN_PASSWORD
          script: |
            set -eu
            cd monino-tools-nginx/

            if [ "${{ inputs.operation }}" = "rollback" ]; then
              cd /root/monino-tools-current
              COMPOSE_PROJECT_NAME=monino-tools-nginx ./rollback.sh
              exit 0
            fi

            if [ "${{ inputs.operation }}" = "cleanup" ]; then
              CLEANUP_RUN_ID="${{ inputs.cleanup_run_id }}"
              case "$CLEANUP_RUN_ID" in
                ''|*[!0-9]*) echo "cleanup_run_id must contain digits only" >&2; exit 1 ;;
              esac
              TEST_PROJECT="monino-tools-verify-$CLEANUP_RUN_ID"
              for container_id in $(docker ps -aq --filter "label=com.docker.compose.project=$TEST_PROJECT"); do
                docker rm --force "$container_id"
              done
              for volume_name in $(docker volume ls -q --filter "label=com.docker.compose.project=$TEST_PROJECT"); do
                docker volume rm "$volume_name"
              done
              for network_id in $(docker network ls -q --filter "label=com.docker.compose.project=$TEST_PROJECT"); do
                docker network rm "$network_id"
              done
              docker image rm \
                "monino-tools-api:verify-$CLEANUP_RUN_ID" \
                "monino-tools-admin:verify-$CLEANUP_RUN_ID" \
                "monino-tools-user:verify-$CLEANUP_RUN_ID" || true
              rm -rf "/root/monino-tools-releases/$CLEANUP_RUN_ID"
              docker builder prune --force
              docker image prune --force
              df -h /
              df -ih /
              docker system df
              exit 0
            fi

            if [ "${{ inputs.operation }}" = "audit" ]; then
              echo "=== SYSTEM ==="
              hostname
              uname -sr
              docker --version
              docker compose version
              df -h /
              df -ih /
              echo "=== REPOSITORY ==="
              git branch --show-current
              git rev-parse HEAD
              git status --short
              git submodule status
              echo "=== CONFIGURATION KEYS ==="
              if [ -f .env ]; then
                sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1=<configured>/p' .env
              else
                echo ".env is missing"
              fi
              echo "=== CONTAINERS ==="
              docker compose ps
              echo "=== SERVICE MOUNTS ==="
              for service in postgres api; do
                CONTAINER_ID=$(docker compose ps -q "$service")
                echo "--- $service ---"
                docker inspect --format '{{range .Mounts}}{{.Type}}|{{.Name}}|{{.Source}}|{{.Destination}}{{println}}{{end}}' "$CONTAINER_ID"
              done
              echo "=== PROJECT VOLUMES ==="
              docker volume ls --filter label=com.docker.compose.project=monino-tools-nginx --format '{{.Name}}'
              echo "=== DOCKER DISK ==="
              docker system df
              exit 0
            fi

            if [ "${{ inputs.operation }}" = "verify" ]; then
              SOURCE_DIR=$PWD
              RELEASE_ROOT=/root/monino-tools-releases/${{ github.run_id }}
              TEST_DIR=$RELEASE_ROOT/release
              TEST_PROJECT=monino-tools-verify-${{ github.run_id }}
              cleanup() {
                if [ -f "$TEST_DIR/.env" ]; then
                  docker compose \
                    --project-name "$TEST_PROJECT" \
                    --project-directory "$TEST_DIR" \
                    --env-file "$TEST_DIR/.env" \
                    -f "$TEST_DIR/docker-compose.yml" \
                    -f "$TEST_DIR/docker-compose.verify.yml" \
                    down --volumes --remove-orphans || true
                fi
                docker image rm \
                  monino-tools-api:verify-${{ github.run_id }} \
                  monino-tools-admin:verify-${{ github.run_id }} \
                  monino-tools-user:verify-${{ github.run_id }} || true
                docker builder prune --force || true
                docker image prune --force || true
                rm -rf "$RELEASE_ROOT"
              }
              trap cleanup EXIT

              cp "$SOURCE_DIR/.env" "$TEST_DIR/.env"

              docker compose exec -T postgres sh -c \
                'PGPASSWORD="$POSTGRES_PASSWORD" pg_dump --format=custom --create --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"' \
                > "$TEST_DIR/postgres.dump"
              docker compose exec -T api tar -C /app/static -czf - . \
                > "$TEST_DIR/static-data.tar.gz"

              cd "$TEST_DIR"
              ./validate-release.sh
              set -a
              . ./release.env
              set +a
              export RELEASE_VERSION=verify-${{ github.run_id }}
              export API_VERSION=verify-${{ github.run_id }}
              export ADMIN_VERSION=verify-${{ github.run_id }}
              export USER_VERSION=verify-${{ github.run_id }}
              COMPOSE="docker compose --project-name $TEST_PROJECT --project-directory $TEST_DIR --env-file $TEST_DIR/.env -f $TEST_DIR/docker-compose.yml -f $TEST_DIR/docker-compose.verify.yml"
              echo "=== BUILD TEST IMAGES ==="
              $COMPOSE build --quiet api admin user
              echo "=== START TEST POSTGRES ==="
              $COMPOSE up -d postgres

              POSTGRES_ID=$($COMPOSE ps -q postgres)
              for attempt in $(seq 1 30); do
                STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$POSTGRES_ID")
                [ "$STATUS" = healthy ] && break
                [ "$STATUS" = unhealthy ] && exit 1
                sleep 2
              done
              [ "$STATUS" = healthy ]

              echo "=== RESTORE DATABASE AND IMAGES ==="
              $COMPOSE exec -T postgres sh -c \
                'PGPASSWORD="$POSTGRES_PASSWORD" pg_restore --clean --if-exists --create --username="$POSTGRES_USER" --dbname=postgres' \
                < postgres.dump
              $COMPOSE run --rm --no-deps -T api sh -c \
                'find /app/static -mindepth 1 -delete && tar -C /app/static -xzf -' \
                < static-data.tar.gz

              echo "=== RUN MIGRATIONS TWICE ==="
              $COMPOSE run --rm --no-deps api npm run migration:up
              $COMPOSE run --rm --no-deps api npm run migration:up
              echo "=== START TEST API ==="
              $COMPOSE up -d --no-deps api

              for service in api; do
                CONTAINER_ID=$($COMPOSE ps -q "$service")
                for attempt in $(seq 1 36); do
                  STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_ID")
                  [ "$STATUS" = healthy ] && break
                  [ "$STATUS" = unhealthy ] && {
                    docker inspect --format '{{json .State.Health}}' "$CONTAINER_ID"
                    $COMPOSE logs --tail=100 "$service"
                    exit 1
                  }
                  sleep 5
                done
                [ "$STATUS" = healthy ]
              done

              echo "=== START TEST WEB APPLICATIONS ==="
              $COMPOSE up -d --no-deps admin user
              for service in admin user; do
                CONTAINER_ID=$($COMPOSE ps -q "$service")
                for attempt in $(seq 1 36); do
                  STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_ID")
                  [ "$STATUS" = healthy ] && break
                  [ "$STATUS" = unhealthy ] && {
                    docker inspect --format '{{json .State.Health}}' "$CONTAINER_ID"
                    $COMPOSE logs --tail=100 "$service"
                    exit 1
                  }
                  sleep 5
                done
                [ "$STATUS" = healthy ]
              done

              echo "=== RUN INTERNAL SMOKE TESTS ==="
              $COMPOSE exec -T api node -e \
                "Promise.all(['/health','/category','/tools','/tool-types'].map(path => fetch('http://localhost:3000'+path).then(response => { if (!response.ok) throw new Error(path+' '+response.status) }))).catch(error => { console.error(error); process.exit(1) })"
              $COMPOSE exec -T api node -e \
                "Promise.all([['/auth/profile',401],['/auth/reg',404],['/user',404]].map(([path,status]) => fetch('http://localhost:3000'+path,{method:path==='/auth/reg'?'POST':'GET'}).then(response => { if (response.status !== status) throw new Error(path+' '+response.status) }))).catch(error => { console.error(error); process.exit(1) })"
              $COMPOSE exec -T admin wget -q --spider http://127.0.0.1/healthz
              $COMPOSE exec -T user node -e \
                "fetch('http://127.0.0.1:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
              echo "Isolated verification passed."
              exit 0
            fi

            SOURCE_DIR=$PWD
            RELEASE_ROOT=/root/monino-tools-releases/${{ github.run_id }}
            RELEASE_DIR=$RELEASE_ROOT/release
            cp "$SOURCE_DIR/.env" "$RELEASE_DIR/.env"
            for runtime_dir in acme.sh certs html; do
              rm -rf "$RELEASE_DIR/$runtime_dir"
              ln -s "$SOURCE_DIR/$runtime_dir" "$RELEASE_DIR/$runtime_dir"
            done
            cd "$RELEASE_DIR"
            BACKUP_ROOT="$SOURCE_DIR/backups" COMPOSE_PROJECT_NAME=monino-tools-nginx ./deploy.sh
            docker builder prune --force || true
            docker image prune --force || true
            ln -sfn "$RELEASE_DIR" /root/monino-tools-current
